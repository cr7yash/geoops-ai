name: geoops-ai

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      HOST: 0.0.0.0
      PORT: 8000
      MAPS_PROVIDER: ${MAPS_PROVIDER:-mock}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAPS_TIMEOUT_SECONDS: ${MAPS_TIMEOUT_SECONDS:-10}
      KNOWLEDGE_DOCUMENTS_PATH: /app/data/documents
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-900}
      KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-120}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-local}
      MODEL_NAME: ${MODEL_NAME:-geoops-local-planner-v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      APPROVAL_STORE: ${APPROVAL_STORE:-memory}
      APPROVAL_TTL_MINUTES: ${APPROVAL_TTL_MINUTES:-30}
      FIRESTORE_APPROVALS_COLLECTION: ${FIRESTORE_APPROVALS_COLLECTION:-approval_requests}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./apps/api/tests:/app/apps/api/tests:ro
      - ./data/documents:/app/data/documents:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-next-cache:/workspace/apps/web/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  web-app-node-modules:
  web-next-cache:
