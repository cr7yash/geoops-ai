[project]
name = "geoops-ai-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/*" = ["S101"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["apps/api/tests"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
files = ["apps/api/src"]

